name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # attach the APK to a release on tag pushes

env:
  QT_VERSION: '6.8.3'
  NDK_VERSION: '26.1.10909125'
  APP_ID: 'io.github.firatturkerirci.femm'

jobs:
  scripts:
    name: Demo scripts (desktop, headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the headless engine and solvers
        run: |
          sudo apt-get install -y -qq ninja-build > /dev/null
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target femm_headless fkn belasolv hsolv csolv
      - name: Run every script in android/scripts
        run: |
          mkdir -p run && cp android/scripts/*.py run/ && cd run
          for f in *.py; do
            echo "=== $f"
            ../build/bin/femm_headless -run "$f" 2>&1 | tee out.txt
            if grep -q "Script error" out.txt; then exit 1; fi
          done

  apk:
    name: APK (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64-v8a: what tablets and phones run; this is the release APK.
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          # x86_64: Chromebooks and the emulator the smoke test runs on.
          - abi: x86_64
            qt_arch: android_x86_64
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the build number is counted from git history

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}-host-gcc64-v2

      - name: Install Qt for Android (plus the desktop host Qt)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --quiet "aqtinstall>=3.3"
          python3 -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O ~/Qt
          python3 -m aqt install-qt all_os android "$QT_VERSION" ${{ matrix.qt_arch }} -O ~/Qt \
            || python3 -m aqt install-qt linux android "$QT_VERSION" ${{ matrix.qt_arch }} -O ~/Qt
          ls ~/Qt/"$QT_VERSION"

      - name: Locate Qt
        run: |
          echo "QT_ROOT_DIR=$HOME/Qt/$QT_VERSION/${{ matrix.qt_arch }}" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$HOME/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Install the Android NDK and platform
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DFEMM_ANDROID_VERSION_CODE=${{ github.run_number }}

      - name: Build native code
        run: cmake --build build-android --parallel 4

      - name: Build APK
        run: cmake --build build-android --target apk

      - name: Show the generated manifest and gradle settings
        if: always()
        run: |
          mkdir -p android-build-info
          find build-android -name AndroidManifest.xml -o -name build.gradle -o -name gradle.properties \
            | grep -v "/intermediates/" | while read f; do
              echo "=== $f"; cat "$f"; cp "$f" "android-build-info/$(echo "$f" | tr / _)"
            done
          find build-android -name "*.apk" -print

      - name: Sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          UNSIGNED=$(find build-android -name "*release-unsigned.apk" | head -1)
          [ -n "$UNSIGNED" ] || UNSIGNED=$(find build-android -name "*.apk" | head -1)
          echo "input: $UNSIGNED"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
          else
            # No release key configured: sign with a throwaway key so the APK
            # installs. Updating over it needs an uninstall first.
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a temporary key"
            KEYSTORE_PASS=android
            KEY_ALIAS=femm
            keytool -genkeypair -keystore release.keystore -storepass "$KEYSTORE_PASS" \
              -keypass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=FEMM Android CI" > /dev/null
          fi
          OUT="femm-android-${{ matrix.abi }}.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" --out "$OUT" aligned.apk
          "$BUILD_TOOLS/apksigner" verify "$OUT"
          rm -f release.keystore aligned.apk
          echo "--- native libraries in the APK"
          unzip -l "$OUT" | grep "lib/" || true
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: femm-android-${{ matrix.abi }}
          path: femm-android-${{ matrix.abi }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-build-info-${{ matrix.abi }}
          path: android-build-info/

      - name: Free disk space for the emulator
        if: matrix.abi == 'x86_64'
        run: |
          rm -rf build-android
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - name: Enable KVM for the emulator
        if: matrix.abi == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an emulator (run the demo script in the app)
        if: matrix.abi == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disk-size: 3000M
          ram-size: 3072M
          disable-animations: true
          script: bash android/ci/smoke_test.sh femm-android-x86_64.apk ${{ env.APP_ID }} smoke

      - uses: actions/upload-artifact@v4
        if: always() && matrix.abi == 'x86_64'
        with:
          name: smoke-test
          path: smoke/

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.abi == 'arm64-v8a'
        uses: softprops/action-gh-release@v2
        with:
          files: femm-android-arm64-v8a.apk
          prerelease: true
